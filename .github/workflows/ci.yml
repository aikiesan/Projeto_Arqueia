name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: arqueia_test
          POSTGRES_USER: arqueia
          POSTGRES_PASSWORD: arqueia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arqueia -d arqueia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://arqueia:arqueia_test@localhost:5432/arqueia_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      JWT_ACCESS_TTL_SECONDS: 900
      PUBLIC_ORIGIN: http://localhost:4002
      NEXT_PUBLIC_API_URL: http://localhost:4001
      DEV_SEED_ADMIN_PASSWORD: ci-only-admin-password
      OIDC_ENABLED: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Docker development topology
        run: docker compose --file docker-compose.dev.yml config --quiet

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Seed test environment
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
