# Bloco para inserir dentro do VirtualHost *:80 de cp2b.unicamp.br.
#
# Arquivo alvo na VM (verificado em 11/09/2026):
#   /etc/apache2/sites-available/cp2b.unicamp.br.conf
# Nao confundir com deployment/apache2/cp2b.conf do repositorio do site, que
# esta defasado em relacao ao vhost que esta no ar.
#
# Inserir depois do bloco "PILAR-2b SSR" e antes do <Directory> da SPA.
#
# O <Directory> do vhost usa AllowOverride All: as regras de rewrite efetivas
# vem do .htaccess publicado em dist/, nao do vhost. A exclusao de /arqueia
# precisa existir nos dois lugares.

# O Next.js funciona como BFF inclusive em /arqueia/api/*; a API NestJS
# permanece privada em loopback e nunca é publicada diretamente pelo Apache.
# Preserva o Host original. Sem isto o mod_proxy reescreve Host para
# 127.0.0.1:4002 enquanto o browser envia Origin: https://cp2b.unicamp.br, e a
# checagem anti-CSRF do BFF (hasTrustedOrigin) rejeita login, logout e troca de
# senha com 403.
#
# A diretiva vale para o VirtualHost inteiro e ja esta declarada no topo do
# vhost do CP2b (verificado em 11/09/2026), convivendo com /pilar2b, /abiove e
# /api/. Mantida aqui como contrato explicito: se ela sair, o login quebra.
ProxyPreserveHost On

ProxyPass        /arqueia            http://127.0.0.1:4002/arqueia
ProxyPassReverse /arqueia            http://127.0.0.1:4002/arqueia

<Location /arqueia>
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "cp2b.unicamp.br"
    RequestHeader set X-Forwarded-Prefix "/arqueia"
</Location>

# Adicionar junto às exclusões RewriteCond da SPA pública:
# RewriteCond %{REQUEST_URI} !^/arqueia
