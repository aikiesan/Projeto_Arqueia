# Apache2 VirtualHost — arqueia.cp2b.unicamp.br
# Proxy reverso: / → web BFF (Next.js, :4002)
# Next.js BFF atua como gateway de interface e roteia internamente para a API NestJS (:4001)
# Requer módulos: proxy proxy_http proxy_wstunnel headers ssl rewrite remoteip
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers ssl rewrite remoteip
# TLS gerido pelo certbot (--apache --expand).

<VirtualHost *:80>
    ServerName arqueia.cp2b.unicamp.br
    # Redireciona para HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName arqueia.cp2b.unicamp.br

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/cp2b.unicamp.br/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/cp2b.unicamp.br/privkey.pem
    Include                 /etc/letsencrypt/options-ssl-apache.conf

    # Cabeçalhos de segurança
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ProxyPreserveHost On
    ProxyRequests Off

    # Drop any caller-provided forwarding chain. mod_proxy will append the
    # actual TCP peer address when it creates the trusted header for Next.js.
    RequestHeader unset X-Forwarded-For early

    # Normalização segura de IP na borda:
    # O Apache estabelece a identidade de origem com base na conexão TCP real.
    # RemoteIPHeader garante que valores arbitrários de X-Forwarded-For enviados
    # diretamente por clientes não sejam tratados como confiáveis.
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 127.0.0.1

    # WebSocket (Next dev/HMR e eventual realtime)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)   ws://127.0.0.1:4002/$1 [P,L]

    # Frontend + BFF (Next.js gerencia todas as rotas públicas, incluindo / e /api/*)
    # As rotas /api/* no Next.js validam a sessão (cookie HttpOnly) e fazem proxy
    # autenticado para o backend NestJS (:4001) em loopback interno.
    ProxyPass        /  http://127.0.0.1:4002/
    ProxyPassReverse /  http://127.0.0.1:4002/

    ErrorLog  ${APACHE_LOG_DIR}/arqueia_error.log
    CustomLog ${APACHE_LOG_DIR}/arqueia_access.log combined
</VirtualHost>
