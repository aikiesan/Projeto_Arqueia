# Apache2 VirtualHost — arqueia.cp2b.unicamp.br
# Proxy reverso: /api → api (Nest, :4001) ; / → web (Next, :4002)
# Requer módulos: proxy proxy_http proxy_wstunnel headers ssl rewrite
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers ssl rewrite
# TLS gerido pelo certbot (--apache --expand). Os blocos ssl_* abaixo são
# preenchidos/ajustados pelo certbot; mantidos aqui como referência.

<VirtualHost *:80>
    ServerName arqueia.cp2b.unicamp.br
    # Redireciona para HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName arqueia.cp2b.unicamp.br

    SSLEngine on
    # Preenchido/gerido pelo certbot:
    SSLCertificateFile      /etc/letsencrypt/live/cp2b.unicamp.br/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/cp2b.unicamp.br/privkey.pem
    Include                 /etc/letsencrypt/options-ssl-apache.conf

    # Cabeçalhos de segurança
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    ProxyPreserveHost On
    ProxyRequests Off

    # API (Nest) — mantém o prefixo /api
    ProxyPass        /api/  http://127.0.0.1:4001/api/
    ProxyPassReverse /api/  http://127.0.0.1:4001/api/

    # WebSocket (Next dev/HMR e eventual realtime)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)   ws://127.0.0.1:4002/$1 [P,L]

    # Frontend (Next)
    ProxyPass        /  http://127.0.0.1:4002/
    ProxyPassReverse /  http://127.0.0.1:4002/

    ErrorLog  ${APACHE_LOG_DIR}/arqueia_error.log
    CustomLog ${APACHE_LOG_DIR}/arqueia_access.log combined
</VirtualHost>
