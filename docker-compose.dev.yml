name: arqueia-dev

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arqueia}
      POSTGRES_USER: ${POSTGRES_USER:-arqueia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arqueia_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    init: true
    restart: unless-stopped
    working_dir: /workspace
    command: npm run dev --workspace @arqueia/api
    environment:
      NODE_ENV: development
      API_PORT: 4001
      DATABASE_URL: ${DATABASE_URL:-postgresql://arqueia:arqueia_dev_only@postgres:5432/arqueia}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-me}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      DEV_SEED_ADMIN_PASSWORD: ${DEV_SEED_ADMIN_PASSWORD:-change-this-dev-password}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:4002}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME:-Entrar com Unicamp}
      OIDC_AUTHORIZATION_URL: ${OIDC_AUTHORIZATION_URL:-}
    ports:
      - "${API_PORT:-4001}:4001"
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    init: true
    restart: unless-stopped
    working_dir: /workspace
    command: npm run dev --workspace @arqueia/web
    environment:
      NODE_ENV: development
      WEB_PORT: 4002
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4001}
      API_INTERNAL_URL: http://api:4001
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-4002}:4002"
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/apps/web/node_modules
      - web_next_cache:/workspace/apps/web/.next
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4002').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile.dev
    init: true
    restart: unless-stopped
    working_dir: /workspace
    command: npm run dev --workspace @arqueia/worker
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql://arqueia:arqueia_dev_only@postgres:5432/arqueia}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/apps/worker/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  web_next_cache:
